[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift.watch"
version = "0.1.0"
description = "Drift detection for model inputs and outputs: population stability index, categorical PSI, and KS statistic with status bands. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["drift_watch*"]
